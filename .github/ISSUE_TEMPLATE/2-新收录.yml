name: 推荐新机场
description: 提交一个新的机场收录请求
title: "[新收录] "
labels: ["新内容"]
body:
  - type: input
    id: name
    attributes:
      label: 机场名称
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 官网入口
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: 档位
      options:
        - 低价（月付 ≤10 元）
        - 性价比（10-25 元）
    validations:
      required: true
  - type: input
    id: price
    attributes:
      label: 价格档位
      placeholder: 例：4元/100G/月
    validations:
      required: true
  - type: input
    id: line
    attributes:
      label: 线路类型
      placeholder: 直连 / 中转 / 专线
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 备注与风险
      description: 写明信息来源、已知问题、风险提示。**必须包含风险说明**。
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 信息来源
      description: 哪个评测仓库或渠道看到的
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这不是我自己的推广链接，链接里不含邀请码
          required: true
        - label: 我实际访问过这个机场的官网
          required: true
