name: weekly-check

on:
  schedule:
    # 每周六 03:00 UTC = 北京时间周六 11:00
    - cron: '0 3 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-check
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境信息
        shell: pwsh
        run: |
          $PSVersionTable | Out-String | Write-Host
          "pwsh $($PSVersionTable.PSVersion)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 数据与脚本预检
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: 链接体检（境外环境，无响应判失效）
        shell: pwsh
        # CI 侧没有本地代理，reachable_via 一律记 direct：
        # 「仅墙外可达」这个标记只能由本地带 -ProxyUrl 的预检产出，CI 不会覆盖它
        run: ./scripts/check_links.ps1 -Runner github-actions -TimeoutSec 12 -SecondOpinion

      - name: 落地页品牌核对（能打开 ≠ 打开的是这家）
        shell: pwsh
        continue-on-error: true
        run: ./scripts/check_brand.ps1

      - name: 重新渲染 README 与网页数据
        shell: pwsh
        run: ./scripts/render.ps1

      - name: 提交体检结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只提交体检与渲染会产出的文件，不用 git add -A，避免把临时文件/本地残留一起带进来
          git add -- data/ docs/ README.md
          if git diff --cached --quiet; then
            echo "本次体检结果与本仓库现状一致，跳过提交"
            exit 0
          fi
          git commit -m "chore: 每周体检结果更新"
          git pull --rebase --autostash
          git push

      - name: 上传品牌核对报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-report
          path: brand-report.md
          if-no-files-found: ignore

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
